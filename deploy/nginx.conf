server {
    listen 80;
    server_name sync.tudominio.com;

    # Redirigir todo HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sync.tudominio.com;

    # Certificados (los genera certbot)
    ssl_certificate /etc/letsencrypt/live/sync.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.tudominio.com/privkey.pem;

    # Seguridad SSL básica
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Tamaños de body grandes para uploads/resumable
    client_max_body_size 5G;

    # Archivos estáticos del frontend
    root /opt/syncclient/dist;
    index index.html;

    # Proxy para API del backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
